<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Ambient glow -->
  <circle cx="60" cy="60" r="48" fill="#6366F1" fill-opacity="0.12"/>
  
  <!-- Sound Waves (Left) -->
  <path d="M34 50a14 14 0 0 0 0 20" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M26 42a26 26 0 0 0 0 36" stroke="#C7D2FE" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 3"/>
  
  <!-- Sound Waves (Right) -->
  <path d="M86 50a14 14 0 0 1 0 20" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M94 42a26 26 0 0 1 0 36" stroke="#C7D2FE" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 3"/>
  
  <!-- Microphone Body -->
  <rect x="50" y="28" width="20" height="36" rx="10" fill="#7C3AED" stroke="#4C1D95" stroke-width="2"/>
  <!-- Microphone Grille Line -->
  <line x1="50" y1="40" x2="70" y2="40" stroke="#A78BFA" stroke-width="1.5"/>
  <line x1="50" y1="46" x2="70" y2="46" stroke="#A78BFA" stroke-width="1.5"/>
  
  <!-- U-Shaped Arm -->
  <path d="M42 52v4a18 18 0 0 0 36 0v-4" stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Stand Stem & Base -->
  <path d="M60 74v16" stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>
  <rect x="44" y="90" width="32" height="6" rx="3" fill="#4338CA"/>
  
  <!-- Verified Success Star Accent -->
  <circle cx="78" cy="30" r="12" fill="#10B981" stroke="#ECFDF5" stroke-width="2"/>
  <path d="m74 30 3 3 5-5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
